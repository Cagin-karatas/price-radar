services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: priceradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Uygulama, veritabani hazir olmadan baslamasin
      test: ["CMD-SHELL", "pg_isready -U radar -d priceradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sema gocleri. API'den once calisir ve biter.
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PRICERADAR_DATABASE_URL: postgresql+asyncpg://radar:radar@db:5432/priceradar
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PRICERADAR_DATABASE_URL: postgresql+asyncpg://radar:radar@db:5432/priceradar
      PRICERADAR_MIN_INTERVAL: "1.5"
      PRICERADAR_MAX_CONCURRENCY: "5"
      PRICERADAR_SCRAPE_INTERVAL_MINUTES: "60"
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    entrypoint: ["priceradar"]
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Tek seferlik kazima icin:  docker compose run --rm scraper
  scraper:
    build: .
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PRICERADAR_DATABASE_URL: postgresql+asyncpg://radar:radar@db:5432/priceradar
    volumes:
      - ./config:/app/config:ro
    command: ["scrape", "--verbose"]

volumes:
  pgdata:
